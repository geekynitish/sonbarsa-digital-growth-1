name = "sonbarsa-digital-growth-1"
compatibility_date = "2024-11-01"
main = "worker.js"

routes = [
  { pattern = "sonbarsa.com", custom_domain = true },
  { pattern = "www.sonbarsa.com", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
