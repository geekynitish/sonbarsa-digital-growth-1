name = "sonbarsa-digital-growth-1"
compatibility_date = "2024-11-01"
main = "worker.js"

routes = [
  { pattern = "sonbarsa.com", custom_domain = true },
  { pattern = "www.sonbarsa.com", custom_domain = true }
]

# Cloudflare D1 Database binding for lead capture:
# To bind a live D1 database on Cloudflare, create a database in Cloudflare:
#   `npx wrangler d1 create sonbarsa-db` (or via Cloudflare Dashboard -> D1)
# then uncomment the lines below and replace database_id with your UUID.
#
# [[d1_databases]]
# binding = "DB"
# database_name = "sonbarsa-db"
# database_id = "REPLACE_WITH_YOUR_CLOUDFLARE_D1_DATABASE_ID"
# migrations_dir = "migrations"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
