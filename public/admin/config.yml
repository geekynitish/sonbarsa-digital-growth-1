backend:
  name: github
  repo: geekynitish/sonbarsa-digital-growth-1
  branch: astro-migration
  # OAuth handshake origin — the sonbarsa-decap-oauth Worker.
  base_url: https://sonbarsa-decap-oauth.nitish.workers.dev
  auth_endpoint: auth

# Every entry is drafted on its own branch/PR instead of committing straight
# to `branch` above — nothing triggers a Cloudflare build until you open the
# "Editorial Workflow" board (left sidebar) and hit Publish yourself, so you
# can draft several posts and batch them into one deploy.
publish_mode: editorial_workflow

# Custom media library (see public/admin/media-library.js): every image
# picked in the admin panel is uploaded straight to R2 / img.sonbarsa.com
# and only the resulting URL is written into markdown — no image file is
# ever committed to git.
media_library:
  name: r2
  upload_url: https://sonbarsa-media-upload.nitish.workers.dev/upload

collections:
  - name: blog
    label: Blog
    folder: src/content/blog
    create: true
    extension: md
    format: frontmatter
    summary: '{{title}}'
    sortable_fields: [pubDate, title]
    fields:
      - label: Title
        name: title
        widget: string

      - label: SEO Title
        name: seoTitle
        widget: string
        required: false
        hint: Optional shorter headline for search results (falls back to Title)

      - label: Description
        name: description
        widget: text
        hint: Used as the article excerpt and meta description

      - label: Publish Date
        name: pubDate
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: true

      - label: Hero Image
        name: heroImage
        widget: image
        required: false
        hint: Uploads directly to img.sonbarsa.com via R2

      - label: Category
        name: category
        widget: string
        default: Digital Marketing

      - label: Author
        name: author
        widget: string
        default: SonBarsa Team

      - label: Read Time
        name: readTime
        widget: string
        required: false
        hint: Leave blank to auto-estimate from the article's word count

      - label: Tags
        name: tags
        widget: list
        default: []

      - label: Body
        name: body
        widget: markdown
